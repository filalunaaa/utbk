name: IRT Local-Dependence Null Pilot

on:
  push:
    branches:
      - audit/power-analysis-monte-carlo
    paths:
      - '.github/workflows/irt-local-dependence-pilot.yml'
      - 'scripts/run-local-dependence-null-pilot.js'
      - 'scripts/run-local-dependence-testlet-pilot.js'
      - 'js/synthetic-examinee-engine.js'
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Replications per calibration/validation condition (start with 20)"
        required: true
        default: "20"
      examinees:
        description: "Examinees per replication"
        required: true
        default: "500"

permissions:
  contents: read

concurrency:
  group: irt-local-dependence-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run fixed-bank null and testlet-alternative pilot
        run: node scripts/run-local-dependence-testlet-pilot.js
        env:
          SIM_SEED: "20261128"
          SIM_REPS: ${{ inputs.repetitions || '20' }}
          SIM_N: ${{ inputs.examinees || '500' }}
      - name: Upload pilot result
        uses: actions/upload-artifact@v4
        with:
          name: pytago-local-dependence-testlet-pilot-v1
          path: artifacts/pytago-local-dependence-testlet-pilot-v1.json
          if-no-files-found: error
          retention-days: 30
